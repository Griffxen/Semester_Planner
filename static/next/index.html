<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学期手记 · Semester</title><link rel="icon" type="image/svg+xml" href="/icon.svg?v=2"><script src="/mobile-entry.js"></script><script src="/next/theme.js"></script><link rel="stylesheet" href="/next/paint.css"><link rel="stylesheet" href="/legacy/style.css"><link rel="stylesheet" href="/next/style.css"><link rel="stylesheet" href="/next/workload.css"><link rel="stylesheet" href="/export.css"><link rel="stylesheet" href="/deferred.css"><link rel="stylesheet" href="/task-conflicts.css"><link rel="stylesheet" href="/next/modal-shell.css"><link rel="stylesheet" href="/next/dialog-effects.css">
<script src="/deferred.js"></script><link rel="stylesheet" href="/course-lists.css"><link rel="stylesheet" href="/timetables/embed.css"><link rel="stylesheet" href="/next/workspace.css"></head><body class="next-ui">
<section id="login" class="login"><div class="login-card"><div class="brand"><img class="brand-icon" src="/icon.svg?v=2" alt="">学期手记 <small>SEMESTER</small></div><h1>把整个学期，<br>放在眼前。</h1><form id="login-form"><label>账号<input name="name" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">登录学期手记 →</button></form><p id="login-error" role="alert"></p></div></section>
<div id="app" hidden><aside class="next-sidebar"><a class="brand" href="/next/"><img class="brand-icon" src="/legacy/icon.svg" alt="">学期手记<span class="edition">新版</span></a><button id="profile-button" title="个人资料"></button><div class="side-caption">我的工作空间</div><button id="timetable-button" data-icon="calendar">我的课程</button><button id="sharing-button" data-icon="share">分享管理</button><details id="category-section" open><summary>任务分类</summary><div id="categories"></div><button id="manage-categories" data-icon="tag">管理分类</button></details><button id="mobile-more" aria-expanded="false">设置与账户</button><div class="side-bottom"><details open><summary>设置与账户</summary><button id="settings-button" data-icon="settings">学期设置</button><button id="account-button" data-icon="user">账户设置</button><button id="accounts-button" data-icon="users" hidden>账户管理</button><button id="theme-toggle" class="theme-toggle" type="button"></button><button id="logout-button" data-icon="logout">退出登录</button></details><details><summary>导出与备份</summary><button id="image-button" data-icon="image">导出学期图片</button><button id="export-button" data-icon="download">导出数据备份</button></details></div><a class="legacy-link" href="/legacy/">切回旧版 <span>↗</span></a></aside><main><section id="share-banner" hidden><span id="share-banner-text"></span><button id="exit-preview" hidden>退出预览</button></section><header><div><h1 id="semester-name"></h1><p id="range"></p></div><button id="add-button" class="primary" data-icon="plus">新建任务</button></header><section class="stats" aria-label="全学期统计"><div><span>学期进度</span><strong id="week-stat"></strong><div class="progress"><i id="progress-bar"></i></div></div><div><span>待完成</span><strong id="pending-stat"></strong></div><div><span>未来 7 天截止</span><strong id="soon-stat"></strong></div><div><span>已逾期</span><strong id="late-stat"></strong></div></section><section class="calendar-panel"><div class="toolbar"><nav class="view-switch" aria-label="看板视图"><button id="nav-today" data-icon="sun">今天</button><button id="nav-week" data-icon="calendar">本周</button><button id="nav-all" data-icon="grid">学期</button></nav><div class="nav-tools"><div id="week-navigation"><button id="previous-week" aria-label="上一周">←</button><span id="current-period"></span><button id="next-week" aria-label="下一周">→</button></div><button id="today-button" data-icon="locate">定位今天</button><button id="filter-toggle" data-icon="filter" aria-expanded="false">筛选</button></div></div><section id="filter-panel" hidden><input id="search" placeholder="搜索任务、简称、节点…" aria-label="搜索任务"><label><input id="show-courses" type="checkbox" checked>显示课程</label><select id="course-scope" aria-label="课程显示范围"><option value="week">这周</option><option value="two">这周和下周</option><option value="all">全部</option></select><label><input id="hide-done" type="checkbox">隐藏已完成</label><button id="clear-filter">清除筛选</button></section><div id="filter-summary"></div><div id="calendar"></div><div id="empty" hidden></div></section><footer><button id="undo-delete" hidden>撤销上次删除</button><span id="save-status"></span><a href="/m/?mobile=1">手机版</a><a href="/legacy/">旧版入口</a><span>北京时间 · 全学期统计</span></footer></main></div><dialog id="task-dialog"><form id="task-form"><div class="dialog-head"><h2 id="task-heading">新建任务</h2><button type="button" class="close">×</button></div><div id="task-content-step"><label>任务名称<input name="title" maxlength="120" required placeholder="想完成什么？"></label><label>简称（选填）<input name="short_title" maxlength="40" placeholder="用于节点名称，如：论文修改"></label><label>分类<select name="category"></select></label><label>截止时间（选填，北京时间）<input name="due" type="datetime-local"></label><fieldset class="milestone-editor"><legend>关键节点（选填，北京时间）</legend><input name="milestones" type="hidden" value="[]"><div id="milestone-rows"></div><button id="add-milestone" type="button">＋ 添加节点</button></fieldset><label>备注<textarea name="notes" rows="3" maxlength="4000" placeholder="记录要求、想法或下一步"></textarea></label><label class="check"><input name="done" type="checkbox">已经完成</label></div><div id="task-time-step" hidden><label>安排方式<select name="schedule_mode"><option value="date">按日期</option><option value="minute">精确到分钟（北京时间）</option></select></label><div class="form-row"><label>开始日期<input name="date" type="date" required></label><label>计划完成日期<input name="end_date" type="date" required></label></div><div class="form-row" id="task-times" hidden><label>开始时间<input name="start_time" type="time" step="60"></label><label>结束时间<input name="end_time" type="time" step="60"></label></div></div><p id="task-error" role="alert"></p><div class="dialog-actions"><button id="task-back" type="button" hidden>上一步</button><button id="delete-button" type="button" class="danger">删除任务</button><button class="primary">保存任务</button></div></form></dialog>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-head"><h2>学期设置</h2><button type="button" class="close">×</button></div><label>学期名称<input name="name" required maxlength="80"></label><label>第一教学周的周一<input name="start" type="date" required></label><p id="settings-error" role="alert"></p><button class="primary">保存设置</button></form></dialog><dialog id="accounts-dialog"><div class="dialog-head"><h2>账户汇总</h2><button id="accounts-close">×</button></div><p id="accounts-summary"></p><label>搜索账户<input id="accounts-search" type="search" placeholder="用户名、备注或绑定用户"></label><div id="accounts-list"></div><p id="accounts-error" role="alert"></p></dialog><dialog id="account-dialog"><form id="account-form"><div class="dialog-head"><h2>账户与密码</h2><button type="button" id="account-close">×</button></div><label>操作<select name="action"><option value="self">修改我的密码</option><option value="rename">修改我的用户名</option><option value="create">新增普通账户（管理员）</option><option value="reset">重置账户密码（管理员）</option></select></label><label id="account-name-label" hidden><span id="account-name-caption">目标用户名</span><input name="name" maxlength="64" autocomplete="off"></label><label><span id="account-password-caption">你自己的当前密码</span><input name="current_password" type="password" required autocomplete="current-password"></label><label>新密码（普通账户至少 4 位，管理员至少 12 位）<input name="password" type="password" minlength="4" maxlength="256" required autocomplete="new-password"></label><label>再次输入新密码<input name="confirm_password" type="password" minlength="4" maxlength="256" required autocomplete="new-password"></label><p id="account-error" role="alert"></p><button class="primary">确认提交</button></form></dialog><dialog id="timetable-dialog"><div class="dialog-head"><h2>公共课程表</h2><button id="timetable-close">×</button></div><div id="course-preview"></div><div id="personal-course-changes"></div><button id="import-courses" class="primary">一键导入／更新我的课表</button><details id="course-admin"><summary>管理员编辑模板</summary><textarea id="course-json" rows="14" aria-label="课程模板 JSON"></textarea><h3>节假日 / 停课日期</h3><textarea id="holiday-json" rows="5" aria-label="节假日日期区间 JSON"></textarea><button id="save-courses">保存公共模板与节假日</button></details><p id="course-error" role="alert"></p></dialog><dialog id="journal-dialog"><form id="journal-form"><div class="dialog-head"><h2 id="journal-title">每日手记</h2><button type="button" id="journal-close">×</button></div><label>手记内容<textarea name="body" rows="10" maxlength="10000" placeholder="今天有什么值得记下来的？"></textarea></label><p id="journal-error" role="alert"></p><button class="primary">保存手记</button></form></dialog><dialog id="profile-dialog"><form id="profile-form"><div class="dialog-head"><h2>账户备注</h2><button type="button" id="profile-close">×</button></div><p id="profile-name"></p><label>备注（最多 60 字）<input name="remark" maxlength="60" placeholder="例如：张同学 · 2026 秋季"></label><p id="profile-error" role="alert"></p><button class="primary">保存备注</button></form></dialog><dialog id="category-dialog"><div class="dialog-head"><h2>管理任务分类</h2><button id="category-close">×</button></div><div id="category-rows"></div><h3 class="category-add-heading">新增分类</h3><form id="category-form"><label>分类名称<input name="name" maxlength="20" required></label><label>颜色<input name="color" type="color" value="#7185bd" required></label><label>黄色提醒 · 天数 ≤<input name="warn_days" type="number" min="0" max="3650" step="1" value="7" required></label><label>红色提醒 · 天数 ≤<input name="urgent_days" type="number" min="0" max="3650" step="1" value="2" required></label><button class="primary">新增分类</button></form><p id="category-error" role="alert"></p></dialog><dialog id="sharing-dialog"><div class="dialog-head"><h2>分享管理</h2><button id="sharing-close">×</button></div><h3>绑定给我的展示账户</h3><div id="my-shares"></div><form id="share-policy" hidden><h3 id="share-policy-title"></h3><label class="check"><input name="enabled" type="checkbox">开启分享</label><label class="check"><input name="busy_only" type="checkbox">仅展示占用时间</label><fieldset><legend>允许展示的任务分类</legend><div id="share-categories"></div></fieldset><label>日期范围<select name="range"><option value="week">这周（自动滚动）</option><option value="two">这周和下周（自动滚动）</option><option value="semester">整个学期</option><option value="custom">自定义日期</option></select></label><div id="share-custom" class="form-row" hidden><label>开始<input name="start" type="date"></label><label>结束<input name="end" type="date"></label></div><label class="check"><input name="done" type="checkbox">包含已完成任务</label><label class="check"><input name="notes" type="checkbox">展示任务备注</label><label>每日手记<select name="journal"><option value="none">不展示</option><option value="all">范围内全部手记</option><option value="selected">仅选定日期的手记</option></select></label><div id="share-journal-dates" hidden></div><label class="check"><input name="timetable" type="checkbox">展示范围内课表</label><label class="check"><input name="export" type="checkbox">允许导出看板 PNG</label><button class="primary">保存分享设置</button></form><details id="share-admin" hidden><summary>管理员：创建与绑定</summary><form id="share-admin-form"><label>操作<select name="action"><option value="create">新建展示账户</option><option value="rebind">重新绑定（清空原授权）</option><option value="active">启用／停用展示账户</option></select></label><label id="share-target-wrap" hidden>展示账户<select name="id"></select></label><div id="share-create-fields"><label>新用户名<input name="name" maxlength="64" autocomplete="off"></label><label>新密码（至少 4 位）<input name="password" type="password" minlength="4" maxlength="256" autocomplete="new-password"></label><label>确认新密码<input name="confirm" type="password" autocomplete="new-password"></label></div><label id="share-owner-wrap">绑定日程所有者<select name="owner_id"></select></label><label id="share-active-wrap" class="check" hidden><input name="active" type="checkbox">允许该账户登录</label><label>管理员当前密码<input name="current_password" type="password" required autocomplete="current-password"></label><button class="primary">确认操作</button></form></details><p id="sharing-error" role="alert"></p></dialog><dialog id="shared-detail"><div class="dialog-head"><h2 id="shared-detail-title"></h2><button id="shared-detail-close">×</button></div><p id="shared-detail-body"></p></dialog><div id="toast" role="status" hidden></div><script src="/task-conflicts.js"></script><script src="/course-lists.js"></script><script src="/app.js"></script><script src="/legacy/share.js"></script><script src="/next/icons.js"></script><script src="/next/hints.js"></script><script src="/next/modal-shell.js"></script><script src="/next/dialog-effects.js"></script><script src="/next/app.js"></script><script src="/m/domain.js"></script><script src="/next/workload.js"></script><script src="/export.js"></script><script src="/next/export-entry.js"></script><script src="/next/deferred.js"></script><script src="/timetables/domain.js"></script><script src="/timetables/app.js"></script><script src="/next/workspace.js"></script></body></html>
