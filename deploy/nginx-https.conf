# Replace planner.example.org with your own domain and install the certificate
# and key at the paths below before enabling this site.
limit_req_zone $binary_remote_addr zone=planner_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=planner_api:10m rate=60r/m;

server {
    listen 80;
    server_name planner.example.org;
    return 308 https://planner.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name planner.example.org;
    ssl_certificate /etc/ssl/semester-planner/fullchain.pem;
    ssl_certificate_key /etc/ssl/semester-planner/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 64k;

    location = /api/login {
        limit_req zone=planner_login burst=8 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/v1/agenda {
        limit_req zone=planner_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
