limit_req_zone $binary_remote_addr zone=planner_login:10m rate=5r/m;
server {
    listen 80;
    server_name planner.example.org;
    client_max_body_size 64k;
    location = /api/login {
        limit_req zone=planner_login burst=8 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
